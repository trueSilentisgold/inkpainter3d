<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <radialGradient id="bg" cx="25%" cy="20%" r="95%">
      <stop stop-color="#1b2711"/>
      <stop offset=".55" stop-color="#111a0b"/>
      <stop offset="1" stop-color="#0a1006"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#a8cf72"/>
      <stop offset=".6" stop-color="#ccff91"/>
      <stop offset="1" stop-color="#d9ffa7"/>
    </linearGradient>
    <clipPath id="shot">
      <rect x="604" y="168" width="560" height="350" rx="14"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#7AB830" stroke-opacity=".07" stroke-width="1.5">
    <path d="M75 0V675M150 0V675M225 0V675M300 0V675M375 0V675M450 0V675M525 0V675M600 0V675M675 0V675M750 0V675M825 0V675M900 0V675M975 0V675M1050 0V675M1125 0V675"/>
    <path d="M0 75H1200M0 150H1200M0 225H1200M0 300H1200M0 375H1200M0 450H1200M0 525H1200M0 600H1200"/>
  </g>

  <!-- Header: icon, name -->
  <image x="56" y="40" width="88" height="88" xlink:href="../../../assets/branding/app-icon-large.svg"/>
  <text x="164" y="82" font-family="Space Grotesk" font-weight="500" font-size="34" fill="#f2f2f2">inkpainter3d</text>
  <text x="165" y="110" font-family="JetBrains Mono NL" font-size="16" fill="#98a585" letter-spacing="1.5">FREE 3D TEXTURE PAINTER</text>

  <!-- Version -->
  <text x="56" y="232" font-family="JetBrains Mono NL" font-weight="500" font-size="20" fill="#7AB830" letter-spacing="3">UPDATE</text>
  <text x="52" y="318" font-family="Space Grotesk" font-weight="500" font-size="92" fill="url(#accent)">v0.1.1</text>
  <text x="56" y="366" font-family="Space Grotesk" font-size="28" fill="#f2f2f2">Report bugs right from the app</text>

  <!-- Highlights -->
  <g font-family="Space Grotesk" font-size="22" fill="#d2d2d2">
    <circle cx="64" cy="420" r="5" fill="#7AB830"/>
    <text x="82" y="428">Help → Report a bug… opens a GitHub issue</text>
    <circle cx="64" cy="462" r="5" fill="#7AB830"/>
    <text x="82" y="470">Crash reports, offered on the next start</text>
    <circle cx="64" cy="504" r="5" fill="#7AB830"/>
    <text x="82" y="512">You see everything before it is sent</text>
  </g>

  <!-- Screenshot -->
  <rect x="604" y="168" width="560" height="350" rx="14" fill="#7AB830" opacity=".35" filter="url(#glow)"/>
  <image x="604" y="168" width="560" height="350" preserveAspectRatio="xMidYMid slice" clip-path="url(#shot)" xlink:href="screenshot.png"/>
  <rect x="604" y="168" width="560" height="350" rx="14" fill="none" stroke="#ccff91" stroke-opacity=".55" stroke-width="2"/>

  <!-- Footer -->
  <rect x="0" y="603" width="1200" height="72" fill="#070b04" fill-opacity=".6"/>
  <text x="56" y="647" font-family="JetBrains Mono NL" font-size="20" fill="#d2d2d2">Windows · Linux · macOS</text>
  <text x="1144" y="647" text-anchor="end" font-family="JetBrains Mono NL" font-size="20" fill="#98a585">free · open source · GPL-3.0</text>
</svg>
