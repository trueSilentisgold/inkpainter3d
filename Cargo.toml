[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/ink_app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ink_core = { path = "crates/ink_core" }
ink_io = { path = "crates/ink_io" }
ink_render = { path = "crates/ink_render" }

eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui-wgpu = "0.36"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = "1.4"
tobj = "4"
ufbx = "0.11"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "hdr", "exr"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
